<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#14532d" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      מדיניות אבטחת תוכן.

      connect-src — עד v1.1 היה 'none', כלומר האפליקציה לא יכלה לשלוח דבר
      לשום מקום. מ-v1.2 יש סנכרון אופציונלי, ולכן נפתחה **כתובת אחת בדיוק**:
      שרת ה-Supabase של הפרויקט. לא '*', לא 'https:', ולא תת-דומיינים אחרים.

      מה זה עדיין מונע: קוד זדוני שיוזרק לא יוכל לשלוח את הנתונים ליעד
      שהוא בוחר — רק ליעד שכבר מוגדר כאן, ושם הוא ייתקל ב-RLS ובהצפנה.
      מה זה כבר לא מונע: הבטחה גורפת ש"שום דבר לא עוזב את המכשיר".
      ההבטחה המדויקת מופיעה ב-PRIVACY.md.

      הערה: `frame-ancestors` אינו נתמך ב-<meta> ומוגדר רק ב-public/_headers.
      בפיתוח, ה-WebSocket של Vite חסום ולכן אין רענון אוטומטי — מכוון.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://mregcidikhfzmflofkzz.supabase.co; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      iOS מתעלם מ-SVG ומהסמלים שב-manifest. בלי השורה הזו, "הוספה למסך
      הבית" מייצרת סמל שהוא צילום מסך מוקטן של הדף.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="כספים" />
    <title>ניהול כספים</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
